version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: p54_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  p54:
    build: .
    container_name: p54_pipeline
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BACKEND=ollama
      - DISPLAY=:99
      - USE_LIVE_SIMULATION=false
    volumes:
      - .:/app
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    command: python main.py --interactive

  p54_eval:
    build: .
    container_name: p54_evaluation
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_BACKEND=ollama
    volumes:
      - .:/app
    depends_on:
      - ollama
    command: python -m llm_backend.LLM_eval.eval_report --models ollama --export

  p54_baseline:
    build: .
    container_name: p54_baseline
    volumes:
      - .:/app
    command: python -m llm_backend.LLM_eval.eval_report --baseline-only

  p54_tests:
    build: .
    container_name: p54_tests
    volumes:
      - .:/app
    command: pytest tests/ -v -m "not integration"

volumes:
  ollama_models: